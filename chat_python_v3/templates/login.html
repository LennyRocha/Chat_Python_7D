<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <title>Login y Registro Chat</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/google_button.css') }}"
    />
    <style>
      * {
        transition: all 0.25s ease-in-out;
      }
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: var(--back);
        color: var(--back-text);
      }
      #login_container {
        background: var(--surface);
        color: var(--surface-text);
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 325px;
        box-sizing: border-box;
        gap: 1rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: fit-content;
      }
      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 1rem;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        outline-color: var(--primario);
        caret-color: var(--secundario);
      }
      .login_button {
        padding: 10px 20px;
        margin-bottom: 1rem;
        border: none;
        border-radius: 8px;
        background: var(--primario);
        color: #fff;
        cursor: pointer;
        width: 100%;
      }
      h2 {
        text-align: center;
      }
      .switch {
        font-size: 0.9rem;
        text-align: center;
        margin-top: 1rem;
        cursor: pointer;
        color: var(--primario);
      }
      .switch:hover {
        color: var(--secundario);
      }
      #snackbar {
        position: absolute;
        bottom: 0;
        margin: auto;
        margin-bottom: 2rem;
        background-color: var(--snack);
        color: var(--snack-text);
        width: 100%;
        max-width: 600px;
        box-sizing: border-box;
        padding: 1rem;
        border-radius: 10px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        opacity: 0;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="login_container">
      <h2 id="title">Iniciar sesión</h2>

      <div id="form-login">
        <input type="email" id="login-email" placeholder="Correo" />
        <input type="password" id="login-password" placeholder="Contraseña" />
        <button id="btn-login" class="login_button">Entrar</button>

        <button
          class="gsi-material-button"
          onclick="window.location.href = '/login_google'"
        >
          <div class="gsi-material-button-state"></div>
          <div class="gsi-material-button-content-wrapper">
            <div class="gsi-material-button-icon">
              <svg
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                style="display: block"
              >
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                ></path>
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                ></path>
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                ></path>
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                ></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
              </svg>
            </div>
            <span class="gsi-material-button-contents">Acceder con Google</span>
            <span style="display: none">Acceder con Google</span>
          </div>
        </button>
        <div class="switch" id="to-register">¿No tienes cuenta? Regístrate</div>
      </div>

      <dialog id="modal">
        ¡Contenido del modal!
        <button commandfor="modal" command="close">Continuar</button>
      </dialog>

      <div id="form-register" style="display: none">
        <input type="text" id="reg-nombre" placeholder="Nombre de usuario" />
        <input type="text" id="reg-apellido" placeholder="Nombre de usuario" />
        <input type="email" id="reg-email" placeholder="Correo" />
        <input type="password" id="reg-password" placeholder="Contraseña" />
        <button id="btn-register" class="login_button">Registrarse</button>
        <div class="switch" id="to-login">¿Ya tienes cuenta? Inicia sesión</div>
      </div>
    </div>

    <div id="snackbar" class="off">
      <p id="snack_text">Contenido del snack</p>
      <a href="#" id="close_snack">Cerrar</a>
    </div>

    <script>
      const loginForm = document.getElementById("form-login");
      const regForm = document.getElementById("form-register");
      const title = document.getElementById("title");

      const snack = document.getElementById("snackbar");
      const snack_text = document.getElementById("snack_text");
      const snack_action = document.getElementById("close_snack");

      snack_text.innerHTML = "";

      function popSnackbar() {
        snack.classList.remove("on");
        snack.classList.add("off");
      }

      function showSnackbar() {
        snack.classList.remove("off");
        snack.classList.add("on");
        setTimeout(() => {
          snack.classList.remove("on");
          snack.classList.add("off");
        }, 3000);
      }

      // Cambiar de login a registro
      document.getElementById("to-register").addEventListener("click", () => {
        loginForm.style.display = "none";
        regForm.style.display = "block";
        title.innerText = "Registro";
      });

      document.getElementById("to-login").addEventListener("click", () => {
        loginForm.style.display = "block";
        regForm.style.display = "none";
        title.innerText = "Iniciar sesión";
      });

      // POST /register
      document
        .getElementById("btn-register")
        .addEventListener("click", async () => {
          const nombre = document.getElementById("reg-nombre").value.trim();
          const apellido = document.getElementById("reg-apellido").value.trim();
          const email = document.getElementById("reg-email").value.trim();
          const password = document.getElementById("reg-password").value;

          if (!nombre || !email || !password || !apellido)
            return alert("Completa todos los campos");

          try {
            const res = await fetch("/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ nombre, apellido, email, password }),
            });

            const data = await res.json();

            if (!res.ok) {
              snack_text.innerHTML = data.error;
              showSnackbar();
              return;
            }

            showSnackbar();
            snack_text.innerHTML = `¡Registro exitoso!`;

            // Guardar localmente
            sessionStorage.setItem("user_id", data.user_id);

            setTimeout(() => {
              window.location.href = "/chat";
              window.history.replaceState({}, "", "/chat");
            }, 3000);
          } catch (err) {
            showSnackbar();
            snack_text.innerHTML = `"Error en el registro: ${err}`;
          }
        });

      // POST /login
      document
        .getElementById("btn-login")
        .addEventListener("click", async () => {
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;

          if (!email || !password) return alert("Completa todos los campos");

          try {
            const res = await fetch("/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) {
              showSnackbar();
              snack_text.innerHTML = data.error;
              return;
            }

            sessionStorage.setItem("user_id", data.user_id);
            sessionStorage.setItem("nombre", data.nombre);

            setTimeout(() => {
              window.location.href = "/chat";
            }, 3000);
          } catch (err) {
            showSnackbar();
            snack_text.innerHTML = `"Error en login: ${err}`;
          }
        });

      snack_action.addEventListener("click", (e) => {
        e.preventDefault();
        popSnackbar();
      });
    </script>
  </body>
</html>
